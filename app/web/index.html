<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAX EDITOR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2318a058'/%3E%3Cpath d='M3 12V4l2.5 4L8 4l2.5 4L13 4v8' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<style>
/* La app: una cabecera fina arriba y, debajo, la ventana del nodo (web/editor_core.js) a pantalla completa y siempre abierta.
 * La ventana es un modal (.epl-fondo); aquí se pega debajo de la cabecera y se le quitan «Cerrar» y ✕. */
:root{--max-alto:48px;--max-fondo:#111418;--max-borde:#2a2f3a;--max-texto:#d7dbe2;--max-suave:#8a93a3;--max-verde:#18a058;
  --max-verde-claro:#22c06c;--max-rojo:#f07070;--max-ambar:#e0a94c}
html,body{margin:0;height:100%;background:var(--max-fondo);color:var(--max-texto);font:13px system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.max-cab{position:fixed;top:0;left:0;right:0;z-index:10002;background:#0d1014;border-bottom:1px solid var(--max-borde)}
.max-fila{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:36px;flex-wrap:wrap}
.max-nombre{font-weight:800;letter-spacing:.12em;font-size:14px;color:#fff;white-space:nowrap}
.max-nombre i{font-style:normal;color:var(--max-verde-claro)}
.max-grupo{display:flex;align-items:center;gap:6px}
.max-sep{width:1px;height:22px;background:var(--max-borde)}
.max-cab select,.max-cab input{background:#161a20;color:var(--max-texto);border:1px solid #303642;padding:4px 6px;font:inherit}
.max-cab select{max-width:220px}
.max-boton{background:#232833;color:var(--max-texto);border:1px solid #363d4a;padding:4px 10px}
.max-boton:hover{background:#2c3240}
.max-boton:disabled{opacity:.5;cursor:default}
.max-generar{background:var(--max-verde);border:1px solid var(--max-verde-claro);color:#fff;font-weight:800;font-size:15px;
  padding:7px 22px;letter-spacing:.03em}
.max-generar:hover{background:var(--max-verde-claro)}
.max-generar:disabled{background:#2a5a40;border-color:#2a5a40}
.max-aviso{color:var(--max-suave);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.max-aviso.bien{color:#5fbf7f}.max-aviso.mal{color:var(--max-rojo)}
.max-salud{display:flex;gap:10px;font-size:12px;color:var(--max-suave)}
.max-salud span::before{content:"●";margin-right:4px;color:#555}
.max-salud .si::before{color:#4cd07d}.max-salud .no::before{color:var(--max-rojo)}
.max-semilla input{width:110px}
.max-derecha{margin-left:auto}
.max-idioma .max-boton{padding:3px 7px;font-size:11px}
.max-idioma .max-boton.fijo{background:#3a4252;color:#fff}
.max-pop{position:absolute;z-index:10005;background:#1b1f27;border:1px solid #3a4252;padding:10px;display:flex;gap:6px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* el avance del video: una fila debajo de la cabecera */
.max-avance{display:none;align-items:center;gap:10px;padding:5px 12px;border-top:1px solid var(--max-borde);background:#0f1317}
.max-avance.ver{display:flex}
.max-barra{flex:1;height:10px;background:#20252e;position:relative;overflow:hidden}
.max-barra b{position:absolute;inset:0 auto 0 0;background:var(--max-verde);width:0;transition:width .4s}
.max-avance.mal .max-barra b{background:var(--max-rojo)}
.max-avance .max-texto{min-width:280px;font-size:12px}
.max-avance.mal .max-texto{color:var(--max-rojo)}
/* el preview en vivo (29 oct, variante P1): una cortina debajo de la fila del avance que se abre y se cierra con su botón;
 * va dentro de la cabecera fija, así que al abrirse baja el editor (--max-alto) en vez de taparlo */
.max-preview{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease;background:#0b0e12}
.max-preview.abierta{grid-template-rows:1fr;border-top:1px solid var(--max-borde);border-bottom:3px solid var(--max-cian,#22E4FF)}
.max-preview-dentro{overflow:hidden;min-height:0}
.max-preview-cuerpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:18px;padding:14px 16px}
.max-preview-visor{display:flex;align-items:center;justify-content:center;background:#000;border-radius:6px;overflow:hidden;height:min(50vh,600px)}
.max-preview-visor video,.max-preview-visor img{display:block;width:100%;height:100%;object-fit:contain}
.max-preview-visor .max-vacio{padding:24px;text-align:center}
.max-preview-lado{display:flex;flex-direction:column;gap:14px;min-width:0}
.max-preview-tit{display:flex;align-items:center;gap:10px}.max-preview-tit b{font-size:20px}
.max-preview-punto{width:10px;height:10px;border-radius:50%;background:#22E4FF;flex:none;animation:max-onda 1.6s ease-out infinite}
.max-preview-punto.quieto{animation:none;background:#555}
@keyframes max-onda{0%{box-shadow:0 0 0 0 rgba(34,228,255,.7)}100%{box-shadow:0 0 0 12px rgba(34,228,255,0)}}
.max-preview-pasos{display:flex;flex-wrap:wrap;gap:6px}.max-preview-pasos i{width:28px;height:8px;border-radius:2px;background:#222833;border:1px solid #3a4150}
.max-preview-pasos i.si{background:#22E4FF;border-color:#22E4FF}
.max-preview-info{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.max-preview-recoger{margin-top:auto;align-self:stretch;justify-content:center;display:inline-flex;align-items:center;gap:6px}
/* el botón de la fila del avance: cian, grande, con el preview en chiquito y el paso */
.max-ver-preview{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:4px 14px 4px 5px;border:0;border-radius:8px;cursor:pointer;
  background:#22E4FF;color:#04232A;font-weight:800;font-size:17px;line-height:1;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.max-ver-preview:hover{background:#6CEEFF}
.max-preview-mini{display:inline-flex;align-items:center;justify-content:center;width:62px;height:36px;border-radius:4px;overflow:hidden;background:rgba(4,35,42,.85);color:#22E4FF;flex:none}
.max-preview-mini video,.max-preview-mini img{width:100%;height:100%;object-fit:cover;display:block}
.max-preview-k{font:700 13px ui-monospace,monospace;letter-spacing:0;padding:4px 7px;border-radius:4px;background:rgba(4,35,42,.18)}
.max-preview-flecha{display:inline-flex;transition:transform .3s}.max-ver-preview[aria-expanded=true] .max-preview-flecha{transform:rotate(180deg)}
@keyframes max-destello{0%{box-shadow:0 0 0 0 rgba(34,228,255,.9)}100%{box-shadow:0 0 0 12px rgba(34,228,255,0),0 0 30px 6px rgba(34,228,255,0)}}
.max-ver-preview.nuevo{animation:max-destello 1.1s ease-out 2}
@media (max-width:900px){.max-preview-cuerpo{grid-template-columns:1fr}.max-preview-visor{height:38vh}}
/* la ventana del nodo, pegada debajo de la cabecera y siempre abierta */
body .epl-fondo{top:var(--max-alto);background:none;align-items:stretch}
body .epl-fondo .epl-caja{width:100vw;height:auto;flex:1;border:0;box-shadow:none}
body .epl-fondo .epl-cerrar,body .epl-fondo .epl-x{display:none}
/* los videos (27 oct): una ventana centrada de tamaño medio sobre el fondo atenuado, como la ficha de una referencia */
/* (29 oct) la ventana «Proyectos» (biblioteca.js, variante P1): Proyectos y Biblioteca, como el gestor de DaVinci Resolve */
.max-bib{position:fixed;inset:0;z-index:10004;background:rgba(8,6,12,.72);display:none;align-items:center;justify-content:center;padding:16px}
.max-bib.ver{display:flex}
.max-bib-caja{width:min(1720px,96vw);height:min(960px,92vh);display:flex;flex-direction:column;overflow:hidden;background:#13161c;border:1px solid var(--max-borde);border-radius:10px}
.max-bib-cab{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--max-borde);flex-wrap:wrap}
.max-bib-titulo{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.max-bib-buscar{height:44px;min-width:240px;padding:0 12px;font-size:16px}
.max-bib-cab .max-cerrar{width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.max-bib-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr)}
.max-bib-cuerpo.con-panel{grid-template-columns:280px minmax(0,1fr) minmax(320px,420px)}
.max-bib-lado{display:flex;flex-direction:column;gap:4px;padding:14px;border-right:1px solid var(--max-borde);overflow:auto;background:#0f1216}
.max-bib-tab{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:0;border-radius:6px;background:none;color:var(--max-suave);
  font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:left;cursor:pointer}
.max-bib-tab.activa{background:#222833;color:#fff}
.max-bib-carpeta{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 10px 0 20px;border:0;border-radius:5px;background:none;color:var(--max-texto);
  font-size:15px;text-align:left;cursor:pointer}
.max-bib-carpeta span{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.max-bib-carpeta small{margin-left:auto;padding-left:8px}
.max-bib-carpeta small{font:600 12px ui-monospace,monospace;color:var(--max-suave)}
.max-bib-carpeta:hover{background:#1c212a}.max-bib-carpeta.activa{background:rgba(34,228,255,.12);color:#22E4FF}
.max-bib-centro{overflow:auto;padding:18px 20px;min-width:0}
.max-bib-rotulo{margin:0 0 12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--max-suave)}
.max-bib-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start}
.max-bib-rejilla.videos{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.max-bib-proy,.max-bib-vid{display:flex;flex-direction:column;gap:7px;padding:10px;border:2px solid transparent;border-radius:8px;background:#0f1216;color:inherit;text-align:left;cursor:pointer;min-width:0}
.max-bib-proy:hover,.max-bib-vid:hover{border-color:#3a4150}
.max-bib-proy.elegido{border-color:#FF7A1A;background:rgba(255,122,26,.08)}.max-bib-vid.elegido{border-color:#22E4FF}
.max-bib-proy b{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.max-bib-proy small,.max-bib-vid small{font:500 12px ui-monospace,monospace;color:var(--max-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.max-bib-abierto{margin-left:8px;font-size:12px;color:#3FC46E}
/* (29 oct) la tarjeta de un proyecto: una carpeta de trabajo, no un video (nombre arriba, idea, portada con hojas detrás,
 * caritas de las referencias y de qué está hecho) */
.max-bib-proy{gap:10px;padding:12px 12px 10px;border-top:4px solid #3a4150}
.max-bib-proy.actual{border-top-color:#3FC46E}
.max-bib-proy-cab{display:flex;align-items:center;gap:8px;min-width:0}
.max-bib-proy-cab b{flex:0 1 auto;min-width:0}
.max-bib-idea{font-size:13px;line-height:1.35;color:var(--max-suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.max-bib-portada{position:relative;display:block;margin:4px 8px 6px 0}
.max-bib-portada::before,.max-bib-portada::after{content:"";position:absolute;inset:0;border-radius:6px;border:1px solid #3a4150;background:#1c212a}
.max-bib-portada::before{transform:translate(8px,-6px)}.max-bib-portada::after{transform:translate(4px,-3px)}
.max-bib-portada .max-bib-mini{z-index:1}
.max-bib-sello{position:absolute;right:6px;bottom:6px;z-index:2;padding:2px 7px;border-radius:3px;background:rgba(8,6,12,.82);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.max-bib-piezas{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.max-bib-pieza{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:#1c212a;border:1px solid #3a4150;font-size:12px;font-weight:600}
.max-bib-pieza .ic,.max-bib-pieza svg{width:14px;height:14px}
.max-bib-caritas{display:inline-flex;margin-right:4px}
.max-bib-carita{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #0f1216;background:#2a3140;margin-left:-8px}
.max-bib-caritas>:first-child{margin-left:0}
.max-bib-carita.letra{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.max-bib-mini{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}
.max-bib-mini img,.max-bib-mini video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.max-bib-mini.vacia{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#1c212a 0 12px,#151920 12px 24px)}
.max-bib-mini.vacia span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--max-suave)}
.max-bib-tipo{position:absolute;left:6px;top:6px;z-index:1;padding:2px 7px;border-radius:3px;background:rgba(8,6,12,.8);font-size:11px;font-weight:700;text-transform:uppercase}
.max-bib-traer{display:flex;flex-direction:column;gap:12px;padding:16px;border-left:1px solid var(--max-borde);background:#0f1216;overflow:auto}
.max-bib-traer h3{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;color:#22E4FF}
.max-bib-traer video{width:100%;max-height:38vh;border-radius:6px;background:#000;object-fit:contain}
.max-bib-de{font:500 12px ui-monospace,monospace;color:var(--max-suave)}
.max-bib-aviso{padding:10px 12px;border-radius:6px;border:1px solid #22E4FF;background:rgba(34,228,255,.1);font-size:14px}
.max-bib-traer .max-vid-acciones,.max-bib-traer .max-vid-confirmar{display:grid;gap:8px}
.max-bib-pie{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--max-borde);font-size:14px;color:var(--max-suave)}
.max-boton-proyecto{display:inline-flex;align-items:center;gap:8px;max-width:300px}
.max-reiniciar{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-style:dashed;color:#F7C83A;border-color:#F7C83A;background:transparent}
.max-boton-proyecto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body .max-pop{z-index:10006}
@media (max-width:900px){.max-bib-cuerpo,.max-bib-cuerpo.con-panel{grid-template-columns:1fr}.max-bib-lado{flex-direction:row;flex-wrap:wrap}.max-bib-traer{border-left:0}}
.max-videos{position:fixed;inset:0;z-index:10003;background:rgba(8,6,12,.72);display:none;align-items:center;justify-content:center;padding:16px}
.max-videos.ver{display:flex}
/* (29 oct, a petición del usuario) más grande y en dos columnas: el video y sus acciones · la lista; todo el texto más grande */
.max-videos-caja{width:min(1720px,95vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;background:#13161c;
  border:1px solid var(--max-borde);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.max-videos-caja .max-cerrar{width:48px;height:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.max-videos .max-fila{border-bottom:1px solid var(--max-borde)}
.max-vid-cab{padding:14px 18px;gap:12px;font-size:22px}.max-vid-cab>b{font-size:24px}.max-vid-cuenta{font-size:15px;color:var(--max-suave)}
.max-vid-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.max-vid-izq{display:flex;flex-direction:column;gap:14px;padding:16px;overflow:auto;border-right:1px solid var(--max-borde)}
.max-videos video{width:100%;max-height:64vh;background:#000;display:block}
.max-vid-info{display:flex;flex-direction:column;gap:4px;font-size:17px}.max-vid-info span{font-size:15px;color:var(--max-suave)}
.max-vid-acciones,.max-vid-confirmar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.max-vid-confirmar>b{width:100%;font-size:17px}
.max-vid-accion{min-height:48px;padding:10px 18px !important;font-size:16px !important;display:inline-flex;align-items:center;gap:8px}
.max-vid-origen{font-size:14px;color:var(--max-suave)}
.max-lista{flex:1;overflow:auto;padding:10px}
.max-video{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:6px;border:1px solid transparent;cursor:pointer;
  background:none;color:inherit;font:inherit;text-align:left;border-radius:8px}
.max-video:hover{background:#1b1f27}
.max-video.actual{border-color:#3FC46E;background:rgba(63,196,110,.1)}
.max-video-txt{flex:1;display:flex;flex-direction:column;gap:3px;font-size:17px}
.max-video small{color:var(--max-suave);font-size:14px}
.max-video-prompt{color:#3FC46E;display:inline-flex}
.max-video .epl-icono,.max-video svg{width:22px;height:22px;flex:none}
@media (max-width:900px){.max-vid-cuerpo{grid-template-columns:1fr}.max-vid-izq{border-right:0;border-bottom:1px solid var(--max-borde)}}
.max-vacio{color:var(--max-suave);font-style:italic;padding:10px}
.max-cargando{position:fixed;inset:var(--max-alto) 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--max-suave)}
/* «Retocar el video» (retocar.js): abajo del todo de la ventana; el video con su capa para el rectángulo y la línea de tiempo */
.max-rt-tit .max-rt-nombre{text-transform:none;letter-spacing:0;color:#cfd6e4;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.max-rt-cuerpo{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);gap:18px;align-items:start}
.max-rt-izq{display:flex;flex-direction:column;gap:8px;min-width:0}
.max-rt-marco{position:relative;max-width:100%;margin:0 auto;background:#000;overflow:hidden}
.max-rt-video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.max-rt-capa{position:absolute;inset:0;touch-action:none}
.max-rt-capa.dibujar{cursor:crosshair}
.max-rt-rect{position:absolute;border:2px solid #ffd84a;background:rgba(255,216,74,.18);box-shadow:0 0 0 9999px rgba(0,0,0,.35);cursor:move}
.max-rt-esq{position:absolute;width:14px;height:14px;background:#ffd84a;border:2px solid #222}
.max-rt-esq.nw{left:-8px;top:-8px;cursor:nwse-resize}.max-rt-esq.se{right:-8px;bottom:-8px;cursor:nwse-resize}
.max-rt-esq.ne{right:-8px;top:-8px;cursor:nesw-resize}.max-rt-esq.sw{left:-8px;bottom:-8px;cursor:nesw-resize}
.max-rt-linea{position:relative;height:34px;background:#14171d;border:1px solid #2e3440;cursor:pointer;touch-action:none}
.max-rt-vacio{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.max-rt-vacio[hidden]{display:none}
.max-rt-tramo{position:absolute;top:0;bottom:0;background:rgba(47,98,196,.45);border:2px solid #5b8fe8;cursor:grab;min-width:6px}
.max-rt-asa{position:absolute;top:-2px;bottom:-2px;width:10px;background:#f3f1f0;cursor:ew-resize}
.max-rt-asa.izq{left:-6px}.max-rt-asa.der{right:-6px}
.max-rt-cursor{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ff5a5a;pointer-events:none}
.max-rt-bajo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.max-rt-transporte{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.max-rt-play{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.max-rt-paso{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.max-rt-lectura{font:13px ui-monospace,monospace;font-variant-numeric:tabular-nums;min-width:150px}
.max-rt-ver{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.max-rt-calculando{font:12px ui-monospace,monospace}
.max-rt-tramo-info{display:inline-flex;gap:14px;align-items:center;font:12px ui-monospace,monospace;font-variant-numeric:tabular-nums}
.max-rt-asa{z-index:1;width:14px}.max-rt-asa.elegida{outline:2px solid #fff;outline-offset:1px}
