<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizarrón de la interfaz</title>
<style>
  :root { --fondo: #15171c; --barra: #1f232b; --borde: #333a46; --texto: #e3e6eb; --acento: #e0a94c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #barra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: var(--barra); border-bottom: 1px solid var(--borde); }
  #barra button, #barra label { background: #2a2f39; color: var(--texto); border: 1px solid var(--borde); border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; }
  #barra button.on { background: var(--acento); color: #111; border-color: var(--acento); }
  #barra .sep { width: 1px; height: 24px; background: var(--borde); margin: 0 4px; }
  #barra input[type=color] { width: 34px; height: 30px; border: none; background: none; padding: 0; cursor: pointer; }
  #estado { margin-left: auto; color: #8a93a3; font-size: 12px; }
  #tablero { position: relative; flex: 1; margin: 10px; border-radius: 8px; overflow: hidden; background: #fff; }
  #interfaz { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #capa { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #capa.usar { pointer-events: none; }
  .asa { fill: #fff; stroke: #2c7be5; stroke-width: 1.5; }
  .marco { fill: none; stroke: #2c7be5; stroke-dasharray: 4 3; }
</style>
</head>
<body>
<div id="barra">
  <button data-h="usar" title="Tocar los botones de la interfaz (sin dibujar)">👆 Usar</button>
  <button data-h="mover" title="Elegir una forma para moverla o cambiar su tamaño desde las esquinas">✋ Mover</button>
  <button data-h="lapiz" class="on">✏️ Lápiz</button>
  <button data-h="rect" title="Arrastra para hacerlo; con Mayúscula sale cuadrado">▭ Rectángulo</button>
  <button data-h="elipse" title="Arrastra para hacerlo; con Mayúscula sale un círculo perfecto">◯ Círculo</button>
  <button data-h="goma" title="Toca o arrastra sobre una forma para borrarla">🧽 Goma</button>
  <span class="sep"></span>
  <button id="relleno" title="Las formas nuevas (y la elegida) con o sin relleno">sin relleno</button>
  <input id="color" type="color" value="#e0303a" title="Color">
  <label title="Grosor de la línea">grosor <input id="grosor" type="range" min="1" max="16" value="4"></label>
  <span class="sep"></span>
  <button id="deshacer">↶ Deshacer</button>
  <button id="borrar">🗑 Borrar dibujo</button>
  <span class="sep"></span>
  <button id="verdibujo" title="Tu dibujo encima de la interfaz: visible, tenue u oculto (no se borra)">Dibujo: visible</button>
  <span id="estado">conectando…</span>
</div>
<div id="tablero">
  <iframe id="interfaz" src="interfaz.html"></iframe>
  <svg id="capa"></svg>
</div>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const capa = document.getElementById("capa"), tablero = document.getElementById("tablero");
const estado = document.getElementById("estado");
let formas = [], historial = [], herramienta = "lapiz", relleno = false, elegida = null, version = 0;
let gesto = null;  // lo que se está haciendo con el puntero ahora mismo

// ---- coordenadas: se guardan de 0 a 1 respecto al tablero, para que PC y celular coincidan
const caja = () => tablero.getBoundingClientRect();
const aRel = (e) => { const c = caja(); return [(e.clientX - c.left) / c.width, (e.clientY - c.top) / c.height]; };
const color = () => document.getElementById("color").value;
const grosor = () => +document.getElementById("grosor").value;
const nuevaId = () => Math.random().toString(36).slice(2, 9);

// ---- dibujar las formas en la capa SVG (en píxeles del tablero)
function pintar() {
  const c = caja(), W = c.width, H = c.height;
  capa.setAttribute("viewBox", `0 0 ${W} ${H}`);
  capa.replaceChildren(...formas.map((f) => elemento(f, W, H)));
  if (elegida) {
    const f = formas.find((x) => x.id === elegida);
    if (f) {
      const [x, y, w, h] = limites(f);
      capa.append(svg("rect", { class: "marco", x: x * W - 4, y: y * H - 4, width: w * W + 8, height: h * H + 8 }));
      esquinas(f).forEach(([ax, ay], i) => capa.append(svg("rect", { class: "asa", "data-asa": i, x: ax * W - 6, y: ay * H - 6, width: 12, height: 12 })));
    }
  }
}
function svg(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function elemento(f, W, H) {
  const comun = { "data-id": f.id, stroke: f.color, "stroke-width": f.grosor, fill: f.relleno ? f.color : "none",
                  "stroke-linecap": "round", "stroke-linejoin": "round" };
  if (f.tipo === "trazo") return svg("path", { ...comun, fill: "none", d: f.puntos.map(([x, y], i) => `${i ? "L" : "M"}${x * W} ${y * H}`).join(" ") });
  const x = Math.min(f.x, f.x + f.w) * W, y = Math.min(f.y, f.y + f.h) * H, w = Math.abs(f.w) * W, h = Math.abs(f.h) * H;
  if (f.tipo === "rect") return svg("rect", { ...comun, x, y, width: w, height: h, rx: 2 });
  return svg("ellipse", { ...comun, cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2 });
}
function limites(f) {
  if (f.tipo !== "trazo") return [Math.min(f.x, f.x + f.w), Math.min(f.y, f.y + f.h), Math.abs(f.w), Math.abs(f.h)];
  const xs = f.puntos.map((p) => p[0]), ys = f.puntos.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
}
const esquinas = (f) => { const [x, y, w, h] = limites(f); return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; };

// ---- cambiar una forma a unos límites nuevos (mover o cambiar tamaño)
function ajustar(f, nx, ny, nw, nh, base) {
  if (f.tipo !== "trazo") { Object.assign(f, { x: nx, y: ny, w: nw, h: nh }); return; }
  const [bx, by, bw, bh] = limites(base);
  f.puntos = base.puntos.map(([px, py]) => [nx + (bw ? (px - bx) / bw : 0) * nw, ny + (bh ? (py - by) / bh : 0) * nh]);
}

// ---- puntero
capa.addEventListener("pointerdown", (e) => {
  const p = aRel(e), id = e.target.dataset?.id, asa = e.target.dataset?.asa;
  capa.setPointerCapture(e.pointerId);
  if (herramienta === "goma") { borrarEn(e); gesto = { tipo: "goma" }; return; }
  if (herramienta === "mover") {
    const f = formas.find((x) => x.id === elegida);
    if (asa !== undefined && f) { recordar(); gesto = { tipo: "tam", f, base: JSON.parse(JSON.stringify(f)), fija: esquinas(f)[(+asa + 2) % 4] }; return; }
    elegida = id || null;
    if (id) { recordar(); const g = formas.find((x) => x.id === id); gesto = { tipo: "mover", f: g, base: JSON.parse(JSON.stringify(g)), desde: p }; }
    pintar(); return;
  }
  recordar();
  const f = { id: nuevaId(), tipo: herramienta === "lapiz" ? "trazo" : herramienta, color: color(), grosor: grosor(), relleno: herramienta !== "lapiz" && relleno };
  if (f.tipo === "trazo") f.puntos = [p]; else Object.assign(f, { x: p[0], y: p[1], w: 0, h: 0 });
  formas.push(f);
  gesto = { tipo: "crear", f, desde: p };
  pintar();
});
capa.addEventListener("pointermove", (e) => {
  if (!gesto) return;
  const p = aRel(e), c = caja();
  if (gesto.tipo === "goma") return borrarEn(e);
  if (gesto.tipo === "crear") {
    const f = gesto.f;
    if (f.tipo === "trazo") f.puntos.push(p);
    else {
      let w = p[0] - gesto.desde[0], h = p[1] - gesto.desde[1];
      if (e.shiftKey) { const lado = Math.max(Math.abs(w * c.width), Math.abs(h * c.height)); w = Math.sign(w || 1) * lado / c.width; h = Math.sign(h || 1) * lado / c.height; }
      f.w = w; f.h = h;
    }
  } else if (gesto.tipo === "mover") {
    const [bx, by, bw, bh] = limites(gesto.base);
    ajustar(gesto.f, bx + p[0] - gesto.desde[0], by + p[1] - gesto.desde[1], bw, bh, gesto.base);
  } else if (gesto.tipo === "tam") {
    const [fx, fy] = gesto.fija;
    let w = p[0] - fx, h = p[1] - fy;
    if (e.shiftKey) { const lado = Math.max(Math.abs(w * c.width), Math.abs(h * c.height)); w = Math.sign(w || 1) * lado / c.width; h = Math.sign(h || 1) * lado / c.height; }
    ajustar(gesto.f, Math.min(fx, fx + w), Math.min(fy, fy + h), Math.abs(w), Math.abs(h), gesto.base);
  }
  pintar();
});
capa.addEventListener("pointerup", () => {
  if (!gesto) return;
  if (gesto.tipo === "crear" && gesto.f.tipo !== "trazo") {  // un clic sin arrastrar no deja una forma vacía
    const f = gesto.f;
    if (Math.abs(f.w) < 0.004 && Math.abs(f.h) < 0.004) formas = formas.filter((x) => x !== f);
    else { f.x = Math.min(f.x, f.x + f.w); f.y = Math.min(f.y, f.y + f.h); f.w = Math.abs(f.w); f.h = Math.abs(f.h); }
  }
  gesto = null;
  pintar();
  guardar();
});
function borrarEn(e) {
  const objetivo = document.elementFromPoint(e.clientX, e.clientY)?.dataset?.id;
  if (!objetivo) return;
  if (!gesto) recordar();
  formas = formas.filter((f) => f.id !== objetivo);
  pintar();
}

// ---- barra
document.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => {
  herramienta = b.dataset.h;
  document.querySelectorAll("[data-h]").forEach((x) => x.classList.toggle("on", x === b));
  capa.classList.toggle("usar", herramienta === "usar");
  if (herramienta !== "mover") elegida = null;
  pintar();
});
document.getElementById("relleno").onclick = (e) => {
  relleno = !relleno;
  e.target.textContent = relleno ? "con relleno" : "sin relleno";
  e.target.classList.toggle("on", relleno);
  const f = formas.find((x) => x.id === elegida);
  if (f && f.tipo !== "trazo") { recordar(); f.relleno = relleno; pintar(); guardar(); }
};
document.getElementById("color").oninput = () => {
  const f = formas.find((x) => x.id === elegida);
  if (f) { f.color = color(); pintar(); guardar(); }
};
document.getElementById("deshacer").onclick = () => { if (historial.length) { formas = historial.pop(); elegida = null; pintar(); guardar(); } };
document.getElementById("borrar").onclick = () => { recordar(); formas = []; elegida = null; pintar(); guardar(); };
document.addEventListener("keydown", (e) => {
  if ((e.key === "Delete" || e.key === "Backspace") && elegida) { recordar(); formas = formas.filter((f) => f.id !== elegida); elegida = null; pintar(); guardar(); }
  if (e.key === "z" && (e.ctrlKey || e.metaKey)) document.getElementById("deshacer").click();
});
const vistas = [["visible", 1], ["tenue", 0.3], ["oculto", 0]];
let vista = 0;
document.getElementById("verdibujo").onclick = (e) => {
  vista = (vista + 1) % vistas.length;
  capa.style.opacity = vistas[vista][1];
  capa.style.pointerEvents = vistas[vista][1] === 0 ? "none" : "";
  e.target.textContent = "Dibujo: " + vistas[vista][0];
};
function recordar() { historial.push(JSON.parse(JSON.stringify(formas))); if (historial.length > 100) historial.shift(); }

// ---- guardar en el PC (dibujo.json + dibujo.svg) y seguir los cambios del otro dispositivo
function svgParaGuardar() {
  const W = 1000, c = caja(), H = Math.round(1000 * c.height / c.width);
  const s = svg("svg", { xmlns: SVGNS, width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  s.append(svg("rect", { x: 0, y: 0, width: W, height: H, fill: "#fff" }), ...formas.map((f) => elemento(f, W, H)));
  return s.outerHTML;
}
async function guardar() {
  version = Date.now();
  try {
    await fetch("/dibujo", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ formas, v: version, svg: svgParaGuardar() }) });
    estado.textContent = "guardado · " + new Date().toLocaleTimeString();
  } catch { estado.textContent = "⚠ no se pudo guardar"; }
}
let versionInterfaz = null;
async function seguir() {
  try {
    const iv = (await (await fetch("/version", { cache: "no-store" })).json()).v;
    if (versionInterfaz !== null && iv !== versionInterfaz) document.getElementById("interfaz").src = "interfaz.html?v=" + iv;
    versionInterfaz = iv;
    if (!gesto) {
      const d = await (await fetch("/dibujo", { cache: "no-store" })).json();
      if (d.v && d.v !== version) { formas = d.formas; version = d.v; elegida = null; pintar(); }
    }
    if (!estado.textContent.startsWith("guardado")) estado.textContent = "conectado";
  } catch { estado.textContent = "⚠ sin conexión con el PC"; }
}
setInterval(seguir, 1200);
window.addEventListener("resize", pintar);
seguir().then(pintar);
</script>
</body>
</html>
