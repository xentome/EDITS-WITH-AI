<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Maqueta 1 de la interfaz (24 oct): sigue el dibujo del usuario. Datos reales del edit de Teto (datos_maqueta.json). -->
<style>
  :root { --fondo: #191c22; --panel: #15181e; --borde: #2e3440; --texto: #d7dbe2; --suave: #8a93a3; --acento: #e0a94c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font: 13px system-ui, sans-serif; }
  .app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto minmax(90px, 20%); gap: 8px; padding: 10px 4% 10px 4%; }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 10px; min-height: 0; }
  .titulo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  /* 1 · prompt de la toma elegida */
  #historia { font-size: 13px; line-height: 1.5; } #historia i { color: var(--suave); font-style: normal; font-size: 11px; margin-right: 6px; }
  #toma-prompt { font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.45; color: #cfe0ff; }
  #toma-prompt.vacio { color: var(--suave); font-family: inherit; font-style: italic; }
  /* 2 · referencias */
  .refs { overflow: auto; }
  .refs { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .mitades { flex: 1; min-height: 0; display: grid; grid-template-columns: 2fr 3fr; }
  .mitad { display: flex; flex-direction: column; min-height: 0; padding: 8px 10px; }
  .mitad.DER { background: linear-gradient(#16233a, #121a29); }
  .mitad.DER .titulo { color: #8fb6f0; }
  .mitad.IZQ { background: linear-gradient(#2a1717, #1e1213); border-right: 2px solid #a83a3a; }
  .mitad.IZQ .titulo { color: #f0a0a0; }
  .rejilla { flex: 1; min-height: 0; display: grid; grid-auto-rows: 1fr; gap: 8px; }
  #persistentes { grid-template-columns: 1fr; }
  #prestadas { grid-template-columns: repeat(3, 1fr); }
  .efectos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .efecto { background: #1f2c45; border: 1px solid #2f4a78; border-radius: 6px; padding: 4px 8px; font-size: 11px; }
  .efecto b { color: #8fb6f0; margin-right: 4px; }
  .efecto.usada { outline: 2px solid var(--acento); }
  .efecto.atenuada { opacity: .35; }
  .grupo { cursor: pointer; }
  .mosaico { position: absolute; inset: 4px 4px 30px 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 3px; }
  .mosaico img { position: static !important; width: 100% !important; height: 100% !important; min-height: 0; object-fit: contain; background: #0d1015; border-radius: 4px; }
  .insignia { position: absolute; top: 8px; right: 8px; background: #a83a3a; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  #modal .fondo-modal { position: fixed; inset: 0; background: rgba(5,7,10,.78); display: flex; align-items: center; justify-content: center; z-index: 9; }
  #modal .ventana { width: min(900px, 92vw); max-height: 86vh; overflow: auto; background: var(--fondo); border: 1px solid #a83a3a; border-radius: 10px; padding: 14px; }
  #modal .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
  #modal .fotos div { background: #12151b; border: 1px solid var(--borde); border-radius: 8px; padding: 6px; font-size: 11px; }
  #modal .fotos img { width: 100%; height: 240px; object-fit: contain; display: block; }
  .ref { position: relative; border: 1px solid var(--borde); border-radius: 9px; overflow: hidden; background: #12151b; transition: outline .1s, opacity .15s; min-height: 0; }
  .ref .fondo-img { position: absolute; inset: -12px; background-size: cover; background-position: center; filter: blur(14px) brightness(.45); }
  .ref img { position: absolute; inset: 4px 4px 30px 4px; width: calc(100% - 8px); height: calc(100% - 34px); object-fit: contain; display: block; }
  .ref div { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.85)); padding: 6px 8px !important; }
  .ref div { font-size: 12px; }
  .ref b { color: #cfe0ff; }
  .ref small { color: var(--suave); display: block; }
  .ref.usada { outline: 2px solid var(--acento); }
  .ref.atenuada { opacity: .35; }
  .papel { font-size: 10px; border-radius: 5px; padding: 0 5px; }
  .papel.personaje { background: #2b3a52; } .papel.pose { background: #3a2b52; }
  /* 3 · línea de tiempo */
  .linea { display: flex; gap: 4px; height: 96px; }
  .toma { border-radius: 6px; padding: 5px 7px; cursor: pointer; overflow: hidden; color: #111; font-size: 11px; line-height: 1.25;
          border: 2px solid transparent; min-width: 34px; display: flex; flex-direction: column; justify-content: space-between; }
  .toma.elegida { border-color: #fff; box-shadow: 0 0 0 2px var(--acento); }
  .toma b { font-size: 12px; } .toma span { opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mas { min-width: 44px; border: 1px dashed var(--borde); border-radius: 6px; color: var(--suave); background: none; cursor: pointer; font-size: 18px; }
  .regla { display: flex; justify-content: space-between; color: var(--suave); font-size: 10px; margin-top: 3px; }
  /* 4 · prompt final */
  .final { overflow: auto; }
  .final pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.45 ui-monospace, monospace; }
  .tag { background: #2b3a52; color: #cfe0ff; border-radius: 4px; padding: 0 3px; }
  .boton { margin-left: auto; background: #2f3947; color: #fff; border: 1px solid #3d4a5c; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 11px; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="caja">
    <div class="titulo">Historia general · la narrativa de todo el edit</div>
    <div id="historia"></div>
  </div>
  <div class="caja">
    <div class="titulo">Prompt de la toma</div>
    <div id="toma-prompt" class="vacio">Selecciona una toma para mostrar su prompt</div>
  </div>
  <div class="caja refs">
    <div class="mitades">
      <div class="mitad IZQ">
        <div class="titulo">Lo que no cambia · persistente</div>
        <div class="rejilla" id="persistentes"></div>
      </div>
      <div class="mitad DER">
        <div class="titulo">Lo que se presta · ropa, poses y efectos</div>
        <div class="rejilla" id="prestadas"></div>
        <div class="efectos" id="efectos"></div>
      </div>
    </div>
  </div>
  <div class="caja">
    <div class="titulo">Línea de tiempo · tomas</div>
    <div class="linea" id="linea"></div>
    <div class="regla" id="regla"></div>
  </div>
  <div class="caja final">
    <div class="titulo">Prompt final (después del LLM) <button class="boton" title="En la app: escribir historia y tomas con el LLM">Generar con LLM</button></div>
    <pre id="final"></pre>
  </div>
</div>
<div id="modal"></div>
<script>
const COLORES = ["#f4d35e", "#7bd389", "#6ec5e9", "#f28f8f", "#c39bd3", "#f5b971", "#9ad1c9", "#e6a0c4"];
let D = null, elegida = null;
const el = (t, p = {}, ...h) => { const e = document.createElement(t); for (const k in p) k.startsWith("on") ? e.addEventListener(k.slice(2), p[k]) : e.setAttribute(k, p[k]); h.flat().forEach((x) => e.append(x)); return e; };
const conTags = (txt) => txt.split(/(<(?:Picture|Video|Audio|Subject) \d+>)/).map((s) => /^<Picture \d+>$/.test(s) ? el("span", { class: "tag" }, s) : s);

function pintar() {
  // referencias: dos mitades
  const usadas = elegida ? D.tomas[elegida - 1].refs : [];
  const marca = (tags) => elegida ? (tags.some((t) => usadas.includes(t)) ? " usada" : " atenuada") : "";
  const tarjeta = (tag, nombre, papel) => el("div", { class: "ref" + marca([tag]) },
    el("div", { class: "fondo-img", style: `background-image:url(img/${nombre}.jpg)` }),
    el("img", { src: `img/${nombre}.jpg`, alt: "" }),
    el("div", {}, el("b", {}, tag), " ", el("span", { class: `papel ${papel}` }, papel), el("small", {}, nombre)));
  document.getElementById("persistentes").replaceChildren(...D.persistentes.map((g) =>
    el("div", { class: "ref grupo" + marca(g.fotos.map((f) => f[0])), title: "Abrir la cajita", onclick: () => abrirGrupo(g) },
      el("div", { class: "fondo-img", style: `background-image:url(img/${g.fotos[0][1]}.jpg)` }),
      el("div", { class: "mosaico" }, ...g.fotos.slice(0, 4).map((f) => el("img", { src: `img/${f[1]}.jpg`, alt: "" }))),
      el("span", { class: "insignia" }, `${g.fotos.length} fotos`),
      el("div", {}, el("b", {}, g.nombre), " ", el("span", { class: "papel personaje" }, g.papel), el("small", {}, "cajita · tócala para abrirla")))));
  document.getElementById("prestadas").replaceChildren(...D.prestadas.map(([t, n, p]) => tarjeta(t, n, p)));
  const efectoUsado = elegida ? D.tomas[elegida - 1].efecto : null;
  document.getElementById("efectos").replaceChildren(...D.efectos.map(([c, n]) =>
    el("span", { class: "efecto" + (elegida ? (c === efectoUsado ? " usada" : " atenuada") : "") }, el("b", {}, c), n)));
  // línea de tiempo: el ancho de cada toma es su duración
  const total = D.tomas.at(-1).fin;
  document.getElementById("linea").replaceChildren(...D.tomas.map((t, i) =>
    el("div", { class: "toma" + (elegida === t.k ? " elegida" : ""), style: `flex:${t.fin - t.ini};background:${COLORES[i % COLORES.length]}`,
                title: t.lugar, onclick: () => { elegida = elegida === t.k ? null : t.k; pintar(); } },
      el("b", {}, `Toma ${t.k}`), el("span", {}, t.lugar), el("span", {}, `${t.ini.toFixed(2)}–${t.fin.toFixed(2)} s`))),
    el("button", { class: "mas", title: "Añadir una toma (las demás se estrechan)", onclick: anadir }, "+"));
  document.getElementById("regla").replaceChildren(el("span", {}, "0 s"), el("span", {}, `${total.toFixed(2)} s`));
  // prompt de la toma
  const tp = document.getElementById("toma-prompt");
  if (elegida) { tp.className = ""; tp.replaceChildren(...conTags(D.tomas[elegida - 1].linea || "(toma nueva: aún sin prompt)")); }
  else { tp.className = "vacio"; tp.textContent = "Selecciona una toma para mostrar su prompt"; }
  const h = D.historia;
  document.getElementById("historia").replaceChildren(el("div", {}, el("i", {}, "IDEA"), h.idea), el("div", {}, el("i", {}, "ARCO"), h.arco),
    el("div", {}, el("i", {}, "LUZ Y AMBIENTE"), h.look));
  document.getElementById("final").replaceChildren(...conTags(D.prompt));
}
function abrirGrupo(g) {
  const cerrar = () => document.getElementById("modal").replaceChildren();
  document.getElementById("modal").replaceChildren(el("div", { class: "fondo-modal", onclick: (e) => e.target === e.currentTarget && cerrar() },
    el("div", { class: "ventana" },
      el("div", { class: "titulo" }, `Cajita «${g.nombre}» · ${g.fotos.length} fotos · ${g.papel}`, el("button", { class: "boton", onclick: cerrar }, "cerrar")),
      el("div", { class: "fotos" }, ...g.fotos.map(([t, n]) => el("div", {}, el("img", { src: `img/${n}.jpg`, alt: "" }), el("b", {}, t), " ", n)),
        el("div", { style: "display:flex;align-items:center;justify-content:center;color:#8a93a3;font-size:28px;min-height:240px" }, "+")))));
}
function anadir() {  // maqueta: reparte la duración entre una toma más
  const n = D.tomas.length + 1, total = D.tomas.at(-1).fin;
  D.tomas.push({ k: n, lugar: "toma nueva", refs: [], linea: "" });
  D.tomas.forEach((t, i) => { t.ini = total * i / n; t.fin = total * (i + 1) / n; });
  pintar();
}
fetch("datos_maqueta.json", { cache: "no-store" }).then((r) => r.json()).then((d) => { D = d; pintar(); });
</script>
</body>
</html>
